version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: handler-track-samples-db
    environment:
      POSTGRES_DB: handler_track_samples
      POSTGRES_USER: handler_user
      # IMPORTANTE: usar una contraseña fuerte. La definida en .env debe coincidir.
      # Se eliminó POSTGRES_HOST_AUTH_METHOD=trust para forzar scram-sha-256.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env or environment}
    # Bind solo a 127.0.0.1 para que Postgres NO sea accesible desde la LAN.
    # El backend local se conecta via localhost:5432 (misma máquina).
    # Si necesitas acceso remoto, usa un túnel SSH o VPN — no expongas 5432.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./scripts/enable-rls-local.sql:/docker-entrypoint-initdb.d/02-enable-rls.sql
    networks:
      - handler-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handler_user -d handler_track_samples"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  handler-network:
    driver: bridge